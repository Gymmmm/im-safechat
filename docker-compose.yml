version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: im-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_app
      MYSQL_USER: fcim
      MYSQL_PASSWORD: MyNew@2025Safe
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - im-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: 
      context: ./backend/im-backend
      dockerfile: Dockerfile
    container_name: im-backend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_USER=fcim
      - DB_PASSWORD=MyNew@2025Safe
      - DB_NAME=chat_app
      - JWT_SECRET=production_jwt_secret_change_me
      - PORT=3001
      - ENABLE_BOSS=false
    volumes:
      - ./backend/im-backend/uploads:/app/uploads
    networks:
      - im-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: im-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/im-frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - im-network

volumes:
  mysql_data:

networks:
  im-network:
    driver: bridge
