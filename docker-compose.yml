version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: im-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MyNew@2025Safe
      MONGO_INITDB_DATABASE: safechat
    volumes:
      - mongodb_data:/data/db
    networks:
      - im-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: 
      context: ./backend/im-backend
      dockerfile: Dockerfile
    container_name: im-backend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_USER=fcim
      - DB_PASSWORD=MyNew@2025Safe
      - DB_NAME=chat_app
      - JWT_SECRET=production_jwt_secret_change_me
      - PORT=3001
      - ENABLE_BOSS=false
    volumes:
      - ./backend/im-backend/uploads:/app/uploads
      - mongodb
    environment:
      MONGODB_URI: "mongodb://admin:MyNew%402025Safe@mongodb:27017/safechat?authSource=admin"
      JWT_SECRET: "super_secret_safechat_key_2025"
      PORT: "3001"
      ALLOWED_ORIGINS: "*"
    networks:
      - im-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: im-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/im-frontend/dist:/usr/share/nginx/html
      - ./frontend/modern:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - im-network

volumes:
  mongodb_data:

networks:
  im-network:
    driver: bridge
